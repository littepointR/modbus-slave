stages:
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^feature\/.*$/)
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

.default_node_job: &default_node_job
  before_script:
    - corepack enable
    - corepack prepare yarn@4.10.3 --activate
    - yarn --version
    - yarn install --immutable

build_macos:
  stage: build
  <<: *default_node_job
  tags:
    - macos
  script:
    - yarn build:mac
  artifacts:
    name: "macos-artifacts-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - dist/*.dmg
      - dist/*.zip

build_windows:
  stage: build
  <<: *default_node_job
  tags:
    - windows
  script:
    - yarn build:win
  artifacts:
    name: "windows-artifacts-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - dist/*.exe

build_linux:
  stage: build
  image: node:20-bullseye
  <<: *default_node_job
  tags:
    - linux
  script:
    - yarn build:linux
  artifacts:
    name: "linux-artifacts-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - dist/*.AppImage
      - dist/*.snap
      - dist/*.deb

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build_macos
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: build_linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - when: never
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release generated by GitLab CI"
    assets:
      links:
        - name: "macOS artifacts"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_TAG/download?job=build_macos"
          link_type: package
        - name: "Windows artifacts"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_TAG/download?job=build_windows"
          link_type: package
        - name: "Linux artifacts"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_TAG/download?job=build_linux"
          link_type: package
