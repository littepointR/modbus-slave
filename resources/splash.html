<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Modbus Slave Emulator</title>
  <meta name="theme-color" content="#0b1020" />
  <meta name="msapplication-TileColor" content="#0b1020" />
  <style>
    html,
    body {
      width: 400px;
      height: 300px;
      margin: 0;
      overflow: hidden;
      background: #0b1020;
      font-family: Bahnschrift, 'Segoe UI Variable Display', 'Trebuchet MS', sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #e7f2ff;
      background:
        radial-gradient(120px 90px at 86% 12%, rgba(97, 218, 251, 0.2), transparent 70%),
        radial-gradient(140px 120px at 10% 88%, rgba(56, 189, 248, 0.22), transparent 70%),
        linear-gradient(145deg, #0a1226 0%, #0f1f3f 58%, #15305d 100%);
    }

    .pulse {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 999px;
      border: 1px solid rgba(148, 196, 255, 0.24);
      animation: pulse 2.2s ease-in-out infinite;
      filter: blur(0.2px);
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .brand img {
      width: 92px;
      height: 92px;
      filter: drop-shadow(0 10px 22px rgba(7, 13, 28, 0.62));
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.82;
      letter-spacing: 0.5px;
    }

    .footer {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(213, 232, 255, 0.78);
      letter-spacing: 0.35px;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.92);
        opacity: 0.25;
      }
      50% {
        transform: scale(1.02);
        opacity: 0.68;
      }
      100% {
        transform: scale(0.92);
        opacity: 0.25;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="pulse"></div>
    <div class="brand">
      <img src="icon.png" alt="Modbus Slave Emulator" />
      <div class="title">Modbus Slave Emulator</div>
      <div class="subtitle">Launching communication workspace...</div>
    </div>
    <div class="footer">
      <span>MODBUS TOOLKIT</span>
      <span id="version">v...</span>
    </div>
  </div>
  <script>
    window.api.getAppVersion().then((version) => {
      document.getElementById('version').textContent = `v${version}`
    })
  </script>
</body>
</html>
